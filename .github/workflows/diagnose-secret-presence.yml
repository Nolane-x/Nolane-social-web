name: Diagnose secret presence

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report presence only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          TOKEN_HASH_PEPPER: ${{ secrets.TOKEN_HASH_PEPPER }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID TOKEN_HASH_PEPPER ADMIN_SECRET; do
            if [ -n "${!name}" ]; then
              echo "$name=SET"
            else
              echo "$name=UNSET"
            fi
          done
