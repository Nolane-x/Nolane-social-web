name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nolane-social-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'NolaneAI/Nolane-social-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      TOKEN_HASH_PEPPER: ${{ secrets.TOKEN_HASH_PEPPER }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify before deploy
        run: npm run check
      - name: Build deployment config
        run: node tools/prepare-wrangler.mjs
      - name: Prepare Worker secrets file
        shell: bash
        run: |
          umask 077
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          const required = ['TOKEN_HASH_PEPPER', 'ADMIN_SECRET']
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Missing required GitHub Actions secret: ${name}`)
          }
          const file = path.join(process.env.RUNNER_TEMP, 'nolane-social-secrets.json')
          fs.writeFileSync(file, JSON.stringify(Object.fromEntries(required.map((name) => [name, process.env[name]]))))
          fs.appendFileSync(process.env.GITHUB_ENV, `NOLANE_SECRETS_FILE=${file}\n`)
          NODE
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nolane-social --remote --config .wrangler.generated.jsonc
      - name: Deploy Worker, static assets, and secrets atomically
        run: npx wrangler deploy --config .wrangler.generated.jsonc --secrets-file "$NOLANE_SECRETS_FILE"
