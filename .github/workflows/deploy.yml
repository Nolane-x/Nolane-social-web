name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nolane-social-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'NolaneAI/Nolane-social-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_HASH_PEPPER: ${{ secrets.TOKEN_HASH_PEPPER }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify before deploy
        run: npm run check
      - name: Resolve Cloudflare deployment state
        run: node tools/prepare-cloudflare-deploy.mjs
      - name: Build deployment config
        run: node tools/prepare-wrangler.mjs
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nolane-social --remote --config .wrangler.generated.jsonc
      - name: Deploy Worker and preserve existing secrets
        if: env.NOLANE_SECRETS_FILE == ''
        run: npx wrangler deploy --config .wrangler.generated.jsonc
      - name: Deploy Worker and upload only missing secrets atomically
        if: env.NOLANE_SECRETS_FILE != ''
        run: npx wrangler deploy --config .wrangler.generated.jsonc --secrets-file "$NOLANE_SECRETS_FILE"
